<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />
    <title>Next Knock — Offline</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        background: #fafaf9;
        color: #0a0a0a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .mark {
        width: 72px; height: 72px; border-radius: 16px; background: #0a0a0a;
        display: flex; align-items: center; justify-content: center; margin-bottom: 24px;
      }
      .mark svg { width: 40px; height: 40px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 15px; line-height: 1.5; color: #6b6b6b; max-width: 280px; margin: 0; }
      button {
        margin-top: 24px; height: 44px; padding: 0 20px; border: none; border-radius: 8px;
        background: #0a0a0a; color: #fff; font-size: 16px; font-weight: 500; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fafaf9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4v15M5 12l7 7 7-7" />
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>
      Next Knock needs a connection to load your quotes. Check your signal and try again.
    </p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
